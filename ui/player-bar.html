<template rust:component="PlayerBar">
  <section class="now-playing">
    <div class="cover" class:hidden="{{ !state.jukebox.cover_shown() }}">
      <p class="cover-row">{{ state.jukebox.cover_row(0) }}</p>
      <p class="cover-row">{{ state.jukebox.cover_row(1) }}</p>
      <p class="cover-row">{{ state.jukebox.cover_row(2) }}</p>
    </div>
    <div class="now-main">
    <div class="track-line">
      <div class="track-text">
        <p class="track-title">{{ state.jukebox.track_title() }}</p>
        <p class="track-details">{{ state.jukebox.track_details() }}</p>
      </div>
      <div class="controls">
        <button class="control" on:click="state.jukebox.command(Command::Previous)">{{ crate::icons::get().previous }}</button>
        <button class="play" on:click="state.jukebox.toggle_play()">{{ state.jukebox.play_label() }}</button>
        <button class="control" on:click="state.jukebox.command(Command::Next)">{{ crate::icons::get().next }}</button>
      </div>
      <div class="side">
        <div class="modes">
          <button class="control" class:on="{{ state.jukebox.shuffle_on() }}"
                  on:click="state.jukebox.toggle_shuffle()">{{ crate::icons::get().shuffle }}</button>
          <button class="control" class:on="{{ state.jukebox.repeat_mode() != Repeat::Off }}"
                  on:click="state.jukebox.cycle_repeat()">{{ state.jukebox.repeat_label() }}</button>
        </div>
        <p class="volume"><span class="volume-icon">{{ state.jukebox.volume_icon() }}</span><span class="volume-on">{{
          state.jukebox.volume_meter().0
        }}</span><span class="volume-off">{{ state.jukebox.volume_meter().1 }}</span><span class="volume-percent">{{
          state.jukebox.volume_percent()
        }}</span></p>
      </div>
    </div>
    <div class="progress-line">
      <p class="time">{{ state.jukebox.elapsed_label() }}</p>
      <div class="bar" on:resize="state.jukebox.measure_bar(&event)">
        <p class="bar-text"><span class="played">{{
          state.jukebox.progress_played()
        }}</span><span class="left"
          class:edge1="{{ state.jukebox.edge_level(1) }}"
          class:edge2="{{ state.jukebox.edge_level(2) }}"
          class:edge3="{{ state.jukebox.edge_level(3) }}"
          class:edge4="{{ state.jukebox.edge_level(4) }}"
          class:edge5="{{ state.jukebox.edge_level(5) }}"
          class:edge6="{{ state.jukebox.edge_level(6) }}"
          class:edge7="{{ state.jukebox.edge_level(7) }}">{{
          state.jukebox.progress_edge()
        }}</span><span class="left">{{ state.jukebox.progress_left() }}</span></p>
      </div>
      <p class="time time-end">{{ state.jukebox.length_label() }}</p>
    </div>
    </div>
  </section>
</template>
