<template rust:component="Shelves">
  <section id="shelves" class="shelves" class:active="{{ state.jukebox.shelves_focused.get() }}"
           on:keydown="state.jukebox.leave_shelves(&event)">
    <p class="pane-title">YOUR LIBRARY</p>
    <button class="shelf" on:focus="state.jukebox.shelves_focused.set(true)" on:blur="state.jukebox.shelves_focused.set(false)" class:current="{{ state.jukebox.searching() }}"
            on:click="state.jukebox.start_search()">{{ crate::icons::get().search }}Search</button>
    <button class="shelf" on:focus="state.jukebox.shelves_focused.set(true)" on:blur="state.jukebox.shelves_focused.set(false)" class:current="{{ state.jukebox.is_current(&Source::Liked) }}"
            on:click="state.jukebox.open_shelf(Source::Liked)">{{ crate::icons::get().liked }}Liked Songs</button>
    <button class="shelf" on:focus="state.jukebox.shelves_focused.set(true)" on:blur="state.jukebox.shelves_focused.set(false)" class:current="{{ state.jukebox.is_current(&Source::Recent) }}"
            on:click="state.jukebox.open_shelf(Source::Recent)">{{ crate::icons::get().recent }}Recently played</button>
    <p class="pane-title playlists-title">PLAYLISTS</p>
    <div id="playlists">
      <ForEach items="{{ state.jukebox.shelf_rows() }}" key="{{ |row| row.key.clone() }}">
        <button class="shelf" on:focus="state.jukebox.focus_shelf(&item.get())" on:blur="state.jukebox.shelves_focused.set(false)"
                class:folder="{{ item.get().is_folder() }}"
                class:current="{{ item.get().current }}"
                on:click="state.jukebox.choose_shelf(&item.get())">{{
          item.get().label.clone()
        }}</button>
      </ForEach>
    </div>
  </section>
</template>
