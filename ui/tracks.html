<template rust:component="TrackList">
  <section class="listing">
    <div class="header" class:hidden="{{ !state.jukebox.header_shown() }}">
      <div class="header-cover" class:hidden="{{ !state.jukebox.header_cover_shown() }}">
        <p class="header-cover-row">{{ state.jukebox.header_cover_row(0) }}</p>
        <p class="header-cover-row">{{ state.jukebox.header_cover_row(1) }}</p>
        <p class="header-cover-row">{{ state.jukebox.header_cover_row(2) }}</p>
        <p class="header-cover-row">{{ state.jukebox.header_cover_row(3) }}</p>
        <p class="header-cover-row">{{ state.jukebox.header_cover_row(4) }}</p>
      </div>
      <div class="header-text">
        <p class="header-kind">{{ state.jukebox.header_kind() }}</p>
        <h2 class="header-name">{{ state.jukebox.header_name() }}</h2>
        <p class="header-detail"
           class:hidden="{{ state.jukebox.header_detail().is_empty() }}">{{ state.jukebox.header_detail() }}</p>
        <p class="header-byline">{{ state.jukebox.header_byline() }}</p>
      </div>
    </div>
    <div class="listing-heading" class:hidden="{{ state.jukebox.header_shown() }}">
      <h2 class="listing-title">{{ state.jukebox.listing_title() }}</h2>
      <p class="listing-summary">{{ state.jukebox.listing_summary() }}</p>
    </div>
    <input id="search" bind="state.jukebox.search"
           class:hidden="{{ !state.jukebox.searching() }}"
           class:placeholder="{{ state.jukebox.search.with(String::is_empty) }}"
           on:keydown="state.jukebox.submit_search(&event)"
           placeholder="{{ state.jukebox.search_placeholder() }}">
    <section id="tracks" tabindex="0" autofocus on:resize="state.jukebox.resize(&event)"
             on:keydown="state.jukebox.navigate(&event)"
             on:scroll="state.jukebox.navigate(&event)">
      <div class="tracks-main">
      <table>
        <thead>
          <tr>
            <th class="number">#</th>
            <th class="title">Title</th>
            <th class="artist">{{ state.jukebox.artist_heading() }}</th>
            <th class="album">{{ state.jukebox.album_heading() }}</th>
            <th class="length">Length</th>
          </tr>
        </thead>
        <tbody>
          <ForEach items="{{ state.jukebox.rows() }}" key="{{ |row| row.index }}">
            <tr class:selected="{{ item.get().selected }}" class:playing="{{ item.get().playing }}">
              <td class="number" class:unavailable="{{ item.get().unavailable }}">{{ item.get().marker }}</td>
              <td class="title" class:unavailable="{{ item.get().unavailable }}">{{ item.get().title }}</td>
              <td class="artist" class:unavailable="{{ item.get().unavailable }}">{{ item.get().artist }}</td>
              <td class="album" class:unavailable="{{ item.get().unavailable }}">{{ item.get().album }}</td>
              <td class="length" class:unavailable="{{ item.get().unavailable }}">{{ item.get().length }}</td>
            </tr>
          </ForEach>
        </tbody>
      </table>
      <If condition="{{ state.jukebox.listing_empty().is_some() }}">
        <p class="empty">{{ state.jukebox.listing_empty().unwrap_or_default() }}</p>
      </If>
      </div>
      <div class="scrollbar">
        <pre class="scroll-track">{{ state.jukebox.scrollbar()[0].clone() }}</pre>
        <pre class="scroll-thumb">{{ state.jukebox.scrollbar()[1].clone() }}</pre>
        <pre class="scroll-track">{{ state.jukebox.scrollbar()[2].clone() }}</pre>
      </div>
    </section>
    <If condition="{{ state.jukebox.results_shown() }}">
      <SearchResults jukebox="{{ state.jukebox.clone() }}"></SearchResults>
    </If>
  </section>
</template>
